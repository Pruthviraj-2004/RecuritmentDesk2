[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitmentdesk-backend"
version = "1.0.0"
description = "RecruitmentDesk API and workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "google-api-python-client>=2.150",
  "google-auth>=2.35",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "email-validator>=2.2",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
